name: deploy-production

# Deploys to the Hostinger VPS after the `tests` workflow passes on main.
# Can also be triggered manually from the Actions tab (workflow_dispatch).
#
# Required repository secrets:
#   DEPLOY_SSH_KEY — private OpenSSH key authorized on the VPS
#
# Optional repository variables/secrets (defaults shown):
#   DEPLOY_HOST — 76.13.220.161
#   DEPLOY_USER — root

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy when tests succeeded (or on manual dispatch).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pin host key
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST || '76.13.220.161' }}
        run: |
          echo "Deploying to host: $SSH_HOST"
          mkdir -p ~/.ssh
          if [ -z "$SSH_HOST" ]; then echo "DEPLOY_HOST is empty"; exit 1; fi
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST || '76.13.220.161' }}
          SSH_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            'cd /var/www/soms && bash deploy/deploy.sh'
