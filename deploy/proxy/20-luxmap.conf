# ── LUXMAP (SOMS) ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name luxmap.devokss.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name luxmap.devokss.online;

    ssl_certificate     /etc/nginx/certs/luxmap/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/luxmap/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # purge stale domain-scoped cookies leaked by misconfigured apps (419 fix)
    add_header Set-Cookie "XSRF-TOKEN=deleted; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=/; domain=.devokss.online; secure; samesite=lax" always;
    add_header Set-Cookie "hulagway_session=deleted; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=/; domain=.devokss.online; secure; httponly; samesite=lax" always;

    location / {
        proxy_pass http://172.18.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ \.php$ {
        # SOMS PHP is on the host, not in the labsync app container — deny direct php here
        return 404;
    }
}
