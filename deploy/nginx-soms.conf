# LuxMap (SOMS) — Nginx server block
# Install to: /etc/nginx/sites-available/soms
#   sudo ln -s /etc/nginx/sites-available/soms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After certbot issues the certificate, the HTTP->HTTPS block is rewritten
# automatically by certbot. Until then, HTTP serves directly.

server {
    listen 80;
    listen [::]:80;
    server_name luxmap.devokss.online;

    root /var/www/soms/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Static assets (Vite build output) ---
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- Deny hidden files & sensitive paths ---
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Laravel front controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve these
    location ~ ^/(storage/logs|bootstrap/cache) {
        deny all;
    }
}
