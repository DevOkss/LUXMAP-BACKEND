# LuxMap (SOMS) — Nginx server block
#
# Deployment topology (Hostinger VPS, Option A):
#   Internet -> labsync Docker nginx (ports 80/443, TLS) -> THIS host nginx on
#   127.0.0.1:8090 -> php8.3-fpm socket.
# The public luxmap.devokss.online vhost lives in
# /opt/labsync/.docker/nginx/conf.d/20-luxmap.conf (repo copy:
# deploy/proxy/20-luxmap.conf) and proxies to this server.
#
# Install to: /etc/nginx/sites-available/soms

server {
    # Internal only — the Docker reverse proxy owns the public ports.
    listen 127.0.0.1:8090;
    listen 172.18.0.1:8090;
    server_name luxmap.devokss.online;

    root /var/www/soms/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ ^/(storage/logs|bootstrap/cache) {
        deny all;
    }
}
